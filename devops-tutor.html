<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pipeline.learn — DevOps Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D14; --panel:#121826; --panel-2:#161D2E; --border:#232B3D; --border-soft:#1B2333;
    --text:#E6EDF3; --text-dim:#8B96A5; --text-faint:#4E5768;
    --green:#2FD675; --green-dim:#173821; --amber:#F2A93B; --amber-dim:#3A2C10;
    --violet:#7C8CF0; --red:#F0634A; --mono:'JetBrains Mono', monospace; --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100%;}
  body{-webkit-font-smoothing:antialiased; line-height:1.5;}
  .app{max-width:980px; margin:0 auto; padding:28px 20px 80px;}
  header.top{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:blink 2.4s infinite ease-in-out;}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .brand h1{font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.02em;}
  .brand span{color:var(--text-faint);}
  .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat{display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .stat b{color:var(--text); font-weight:700;}
  .stat.streak b{color:var(--amber);}
  .stat.xp b{color:var(--violet);}
  .reset-btn{font-family:var(--mono); font-size:11px; color:var(--text-faint); background:none; border:1px solid var(--border); border-radius:6px; padding:6px 10px; cursor:pointer; transition:.15s;}
  .reset-btn:hover{color:var(--red); border-color:var(--red);}
  .pipeline-wrap{margin-bottom:26px;}
  .pipeline-label{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-faint); margin-bottom:10px;}
  .pipeline{display:flex; overflow-x:auto; gap:0; padding:6px 2px 14px; scrollbar-width:thin;}
  .pipeline::-webkit-scrollbar{height:6px;}
  .pipeline::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  .stage{flex:0 0 auto; display:flex; align-items:center;}
  .stage .connector{width:26px; height:2px; background:var(--border);}
  .stage.done .connector{background:var(--green);}
  .node{width:120px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; padding:4px; border-radius:8px; transition:.15s;}
  .node:hover{background:var(--panel-2);}
  .node.locked{cursor:not-allowed; opacity:.38;}
  .node .circle{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:15px; font-weight:700; border:1.5px solid var(--border); background:var(--panel); color:var(--text-dim);}
  .node.current .circle{border-color:var(--amber); color:var(--amber); box-shadow:0 0 0 3px var(--amber-dim); animation:pulse 1.8s infinite ease-in-out;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--amber-dim);} 50%{box-shadow:0 0 0 6px var(--amber-dim);}}
  .node.done .circle{border-color:var(--green); color:var(--green); background:var(--green-dim);}
  .node.selected .circle{outline:2px solid var(--violet); outline-offset:2px;}
  .node .label{font-size:11px; text-align:center; color:var(--text-dim); font-weight:600; line-height:1.25; max-width:110px;}
  .node.current .label{color:var(--text);}
  .node .status-line{font-family:var(--mono); font-size:9px; color:var(--text-faint);}
  .node.done .status-line{color:var(--green);}
  .node.current .status-line{color:var(--amber);}
  .eyebrow{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--violet); margin-bottom:6px;}
  .topic-title{font-family:var(--mono); font-size:24px; font-weight:700; margin-bottom:20px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:22px; margin-bottom:18px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .card-head h2{font-family:var(--mono); font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);}
  .btn{font-family:var(--sans); font-weight:600; font-size:13px; padding:9px 16px; border-radius:7px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); cursor:pointer; transition:.15s;}
  .btn:hover{border-color:var(--violet); color:var(--violet);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.primary{background:var(--violet); border-color:var(--violet); color:#0A0D14;}
  .btn.primary:hover{filter:brightness(1.08); color:#0A0D14;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}
  .lesson-body h3{font-family:var(--mono); font-size:14px; color:var(--amber); margin:18px 0 6px; text-transform:uppercase; letter-spacing:.04em;}
  .lesson-body h3:first-child{margin-top:0;}
  .lesson-body p{font-size:14.5px; margin-bottom:10px;}
  .lesson-body ul{margin:0 0 10px 18px;}
  .lesson-body li{margin-bottom:5px; font-size:14.5px;}
  .lesson-body code{font-family:var(--mono); background:var(--panel-2); border:1px solid var(--border); padding:1px 6px; border-radius:4px; font-size:13px; color:var(--green);}
  .lesson-body strong{color:var(--amber);}
  .quiz-q{margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--border-soft);}
  .quiz-q:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
  .quiz-q .qtext{font-size:14.5px; font-weight:600; margin-bottom:10px;}
  .qnum{font-family:var(--mono); color:var(--violet); margin-right:6px;}
  .options{display:flex; flex-direction:column; gap:8px;}
  .option{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border); border-radius:7px; cursor:pointer; font-size:13.5px; transition:.12s; background:var(--panel-2);}
  .option:hover{border-color:var(--violet);}
  .option input{accent-color:var(--violet);}
  .option.correct{border-color:var(--green); background:var(--green-dim);}
  .option.incorrect{border-color:var(--red); background:#2A1414;}
  .explain{font-size:12.5px; color:var(--text-dim); margin-top:8px; padding:8px 10px; background:var(--panel-2); border-left:2px solid var(--violet); border-radius:4px;}
  .score-banner{font-family:var(--mono); font-size:14px; padding:14px; border-radius:8px; background:var(--green-dim); border:1px solid var(--green); color:var(--green); margin-bottom:16px; text-align:center; font-weight:700;}
  footer{text-align:center; color:var(--text-faint); font-family:var(--mono); font-size:11px; margin-top:30px;}
  @media(max-width:640px){.topic-title{font-size:19px;} .card{padding:16px;}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="dot"></div><h1>pipeline<span>.learn</span></h1></div>
    <div class="stats">
      <div class="stat streak">🔥 <b id="streakVal">0</b> day streak</div>
      <div class="stat xp">⚡ <b id="xpVal">0</b> XP</div>
      <button class="reset-btn" id="resetBtn">reset progress</button>
    </div>
  </header>
  <div class="pipeline-wrap">
    <div class="pipeline-label">// your learning pipeline — click any unlocked stage</div>
    <div class="pipeline" id="pipeline"></div>
  </div>
  <div class="eyebrow" id="topicEyebrow">stage</div>
  <div class="topic-title" id="topicTitle">Loading…</div>
  <div class="card">
    <div class="card-head"><h2>Lesson</h2></div>
    <div id="lessonContent" class="lesson-body"></div>
    <div class="btn-row" id="lessonBtnRow"></div>
  </div>
  <div class="card" id="quizCard" style="display:none;">
    <div class="card-head"><h2>Quiz — test yourself</h2></div>
    <div id="quizContent"></div>
  </div>
  <footer>your progress is saved automatically in this browser</footer>
</div>

<script>
const CURRICULUM = [
{id:'t1',cat:'Foundations',title:'What is DevOps & Automation?',
 lesson:{what:"DevOps is a culture and set of practices that bring software development (Dev) and IT operations (Ops) teams together, using automation to build, test, and release software quickly and reliably.",
 why:"Traditionally, developers wrote code and handed it off to a separate operations team to deploy. This caused delays, miscommunication, and slow releases. DevOps removes that wall so teams work together and ship value faster.",
 analogy:"Think of a relay race where each runner used to stop, put the baton down, and walk away before the next runner picked it up. DevOps is like handing the baton directly, without stopping — smooth, continuous handoffs.",
 terms:["Automation: using scripts/tools to do repetitive tasks instead of humans","CI/CD: an automated pipeline that builds, tests, and deploys code","Culture: DevOps is as much about teamwork as tools","Feedback loop: quickly learning if a change worked or broke something"],
 example:"A developer commits code, automated tests run, and if they pass, the app deploys to a test server automatically — all within minutes, no manual steps."},
 quiz:[
  {q:"What does DevOps mainly aim to connect?",o:["Development and Operations teams","Marketing and Sales","Hardware and Software vendors","Customers and Support"],c:0,e:"DevOps bridges the traditional gap between developers who write code and operations teams who run it."},
  {q:'What is "automation" in DevOps mainly used for?',o:["Replacing all human jobs","Performing repetitive tasks without manual effort","Designing user interfaces","Writing marketing content"],c:1,e:"Automation handles repetitive technical tasks like testing and deployment."},
  {q:'In the relay race analogy, what does the "smooth baton handoff" represent?',o:["A software bug","Continuous, fast collaboration between teams","A slow, manual process","A security vulnerability"],c:1,e:"DevOps aims to make handoffs between teams smooth and fast."},
  {q:"What problem existed before DevOps became common?",o:["Too much automation","Developers and operations worked in separate silos with slow handoffs","No internet access","Lack of programming languages"],c:1,e:'The traditional "throw it over the wall" approach caused delays and miscommunication.'},
  {q:"What's an example of a CI/CD pipeline step?",o:["Manually mailing a CD to the client","Automatically running tests when code is pushed","Printing documentation","Scheduling a meeting"],c:1,e:"CI/CD pipelines automatically build, test, and deploy code whenever changes are pushed."}
 ]},
{id:'t2',cat:'Foundations',title:'Linux & the Command Line',
 lesson:{what:"Linux is a free, open-source operating system that powers most servers, cloud machines, and DevOps tools. The command line (terminal) is a text-based way to control a computer by typing instructions instead of clicking icons.",
 why:"Almost every DevOps tool, server, and cloud platform runs on Linux and is controlled through the command line. Knowing basic commands is essential for nearly any automation task.",
 analogy:"If a graphical interface is like ordering food by pointing at pictures, the command line is like calling the kitchen directly and telling them exactly what you want — faster and more precise once you know the words.",
 terms:["Terminal: the program where you type commands","Shell: the program that reads and runs your commands (e.g. bash)","Directory: a folder","Root: the top-level administrator user, or the top folder (/)","Permissions: rules about who can read/write/execute a file"],
 example:"`ls -la` lists all files in the current folder, `cd /var/log` moves into the log folder, and `cat file.txt` shows a file's contents."},
 quiz:[
  {q:"What is Linux mainly used for in DevOps?",o:["Running most servers and cloud infrastructure","Editing photos","Playing video games","Sending emails only"],c:0,e:"Linux is the dominant OS for servers, cloud VMs, and containers."},
  {q:"What does the command line let you do?",o:["Only view images","Control the computer by typing text commands","Design app icons","Browse social media only"],c:1,e:"The terminal lets you control a computer with typed instructions."},
  {q:"What does `ls` do in Linux?",o:["Deletes a file","Lists files in a directory","Creates a new user","Shuts down the system"],c:1,e:"`ls` lists the contents of the current directory."},
  {q:'What is a "shell"?',o:["A type of file extension","The program that reads and executes your typed commands","A graphical design tool","A cloud storage service"],c:1,e:"The shell (like bash) interprets and runs commands you type."},
  {q:"What does `cd` do?",o:["Copy directory","Change directory","Create data","Close device"],c:1,e:"`cd` is used to move between folders in the terminal."}
 ]},
{id:'t3',cat:'Scripting',title:'Shell Scripting Basics',
 lesson:{what:"A shell script is a text file containing a list of commands that the shell runs automatically, one after another — like a recipe the computer follows step by step.",
 why:"Instead of typing the same commands every day, you write them once in a script and run it anytime. This is the foundation of automation in DevOps.",
 analogy:"It's like a checklist you hand to an assistant: instead of telling them each step out loud every time, you write it down once, and they follow it exactly whenever asked.",
 terms:["Script: a file of commands run in order","Shebang: the first line (e.g. #!/bin/bash) telling the system which shell to use","Variable: a named container for a value, like $NAME","Loop: repeating a set of commands automatically","Executable: a file allowed to run as a program (chmod +x)"],
 example:'A script `backup.sh` might contain `#!/bin/bash` then `cp data.txt backup/data_$(date +%F).txt` — automatically backing up a file with today\'s date in the name.'},
 quiz:[
  {q:"What is a shell script?",o:["A picture file","A text file of commands the shell runs in order","A type of database","A network cable"],c:1,e:"A shell script lists commands that execute sequentially."},
  {q:"Why do DevOps engineers use scripts?",o:["To make websites prettier","To automate repetitive tasks","To send emails automatically only","To compile Java code"],c:1,e:"Scripts save time by automating tasks that would otherwise be repeated manually."},
  {q:"What does the shebang line do?",o:["Comments out the whole script","Tells the system which shell/interpreter to use","Deletes the script after running","Encrypts the file"],c:1,e:"`#!/bin/bash` at the top tells the OS which shell to use to run the script."},
  {q:"What is a variable in scripting?",o:["A fixed, unchangeable number","A named container that holds a value","A type of loop","A file permission"],c:1,e:"Variables store values you can reuse and change throughout the script."},
  {q:"What command makes a script executable?",o:["chmod +x scriptname","delete scriptname","cd scriptname","ls scriptname"],c:0,e:"`chmod +x` grants execute permission so the script can run directly."}
 ]},
{id:'t4',cat:'Collaboration',title:'Version Control with Git',
 lesson:{what:"Git is a tool that tracks changes to code over time, letting multiple people work on the same project without overwriting each other's work.",
 why:"In DevOps, code changes constantly, often by many people at once. Git keeps a full history, lets you undo mistakes, and lets automated pipelines trigger whenever new code is pushed.",
 analogy:'Think of Git like "track changes" in a shared document, but far more powerful — every save is a snapshot you can return to, and different people can edit different "versions" (branches) before merging them together.',
 terms:["Repository (repo): a project folder tracked by Git","Commit: a saved snapshot of changes with a message","Branch: a separate line of work, often for a new feature","Merge: combining changes from one branch into another","Push/Pull: sending your changes to, or getting changes from, a shared remote like GitHub"],
 example:'`git add .` stages changes, `git commit -m "fix login bug"` saves them, and `git push` sends them to GitHub.'},
 quiz:[
  {q:"What is Git primarily used for?",o:["Tracking changes to code over time","Designing logos","Sending emails","Managing servers only"],c:0,e:"Git is a version control system that tracks and manages code history."},
  {q:'What is a "commit"?',o:["A permanent deletion of code","A saved snapshot of changes with a message","A type of server","A network protocol"],c:1,e:"A commit records a specific set of changes along with a descriptive message."},
  {q:'What is a "branch" used for?',o:["Storing backups only","Working on a separate line of changes without affecting the main code","Deleting old commits","Compressing files"],c:1,e:"Branches let you develop features independently before merging into the main codebase."},
  {q:"What does `git push` do?",o:["Downloads changes from a remote repo","Sends your local commits to a remote repo like GitHub","Deletes your local repo","Creates a new file"],c:1,e:"`git push` uploads your committed changes to a shared remote repository."},
  {q:"Why does Git matter for CI/CD?",o:["It has nothing to do with CI/CD","Pipelines are often triggered automatically when code is pushed to Git","It replaces the need for testing","It only works for images"],c:1,e:"Git pushes commonly trigger CI/CD pipelines to build, test, and deploy new code."}
 ]},
{id:'t5',cat:'Foundations',title:'Networking Basics for DevOps',
 lesson:{what:"Networking is how computers communicate with each other over connections, sending requests and responses using addresses (IPs) and rules (protocols) like HTTP.",
 why:"DevOps engineers constantly connect services: servers talk to databases, containers talk to each other, users' browsers talk to your app. Understanding basic networking helps you diagnose why things can or can't talk to each other.",
 analogy:'Think of networking like a postal system — every computer has an address (IP address), messages travel in envelopes with rules about format (protocols), and a "port" is like an apartment number at that address, directing the message to the right application.',
 terms:["IP address: a unique numeric address identifying a device on a network","Port: a number identifying which app/service should receive traffic (e.g. 443 for HTTPS)","DNS: translates human-friendly names (like google.com) into IP addresses","Firewall: a rule-based filter that allows or blocks traffic","Load balancer: distributes incoming traffic across multiple servers"],
 example:'When you visit a website, DNS turns "example.com" into an IP address, your browser connects on port 443, and a load balancer may route traffic to one of several servers.'},
 quiz:[
  {q:"What does an IP address do?",o:["Identifies a device uniquely on a network","Stores files permanently","Encrypts passwords","Runs scripts automatically"],c:0,e:"An IP address is a unique numeric identifier for a device on a network."},
  {q:"What does DNS do?",o:["Blocks unwanted traffic","Translates domain names into IP addresses","Compresses files","Manages user permissions"],c:1,e:"DNS converts human-readable names like example.com into machine-usable IP addresses."},
  {q:'What is a "port" in networking?',o:["A physical cable type","A number that directs traffic to the right application on a device","A type of firewall","A programming language"],c:1,e:"Ports let a single device run multiple network services, each listening on its own port."},
  {q:"What does a firewall do?",o:["Speeds up internet connections","Filters traffic based on rules, allowing or blocking it","Stores backups","Compiles code"],c:1,e:"Firewalls control which traffic is allowed in or out based on defined rules."},
  {q:"What is a load balancer used for?",o:["Deleting old servers","Distributing incoming traffic across multiple servers","Writing code","Managing Git branches"],c:1,e:"Load balancers spread traffic across servers to improve reliability and performance."}
 ]},
{id:'t6',cat:'CI/CD',title:'Continuous Integration (CI)',
 lesson:{what:"Continuous Integration is the practice of automatically building and testing code every time a developer pushes a change, so problems are caught immediately instead of weeks later.",
 why:"Without CI, bugs pile up silently until a big, painful integration day. CI catches issues early, when they're small and easy to fix, keeping the codebase always in a working state.",
 analogy:"It's like proofreading each paragraph of an essay as you write it, instead of writing the whole essay blind and only checking spelling at the very end.",
 terms:["Build: compiling/assembling code into a runnable form","Automated tests: code that checks other code works correctly","Pipeline: the sequence of automated steps (build, test, etc.)","Trigger: the event (like a Git push) that starts the pipeline","Green/Red build: passing (green) or failing (red) pipeline result"],
 example:"A developer pushes code, CI automatically runs the test suite, and if all tests pass (green), the team knows the change is safe to merge."},
 quiz:[
  {q:"What triggers a CI pipeline most commonly?",o:["A scheduled coffee break","A code push to the repository","A user login","A server reboot"],c:1,e:"CI pipelines are typically triggered automatically when new code is pushed."},
  {q:"What is the main goal of CI?",o:["To design better UI","To catch bugs early by testing code frequently","To replace developers","To manage cloud billing"],c:1,e:"CI runs automated builds/tests frequently so problems are found while still small."},
  {q:'What does a "red build" mean?',o:["The pipeline passed","The pipeline failed","The code was deleted","A new branch was created"],c:1,e:"A red/failing build signals that something broke during the build or tests."},
  {q:'What is an "automated test"?',o:["A manual code review","Code that automatically checks whether other code works correctly","A type of firewall","A deployment script"],c:1,e:"Automated tests run without human involvement to verify code behaves as expected."},
  {q:"Why is catching bugs early valuable?",o:["It's not valuable","Small, early bugs are cheaper and easier to fix than bugs found later","It slows down development","It only matters for large companies"],c:1,e:"Fixing issues right after they're introduced is far less costly than fixing them later."}
 ]},
{id:'t7',cat:'CI/CD',title:'Continuous Delivery & Deployment',
 lesson:{what:"Continuous Delivery means code is always kept in a state ready to release, with a human approving the final release step. Continuous Deployment goes further — every change that passes tests is released automatically, with no human approval needed.",
 why:"These practices let teams release new features and fixes to users quickly and safely, instead of doing rare, risky big-bang releases every few months.",
 analogy:"Continuous Delivery is like having your suitcase always packed and ready by the door — you still decide when to leave. Continuous Deployment is like an autopilot that leaves the moment the suitcase is packed.",
 terms:["Release: making a new version available to users","Staging environment: a near-identical copy of production used for final testing","Rollback: reverting to a previous, working version if something goes wrong","Approval gate: a manual step required before release (Continuous Delivery only)","Production: the live environment real users interact with"],
 example:"After CI tests pass, the app automatically deploys to staging; in Continuous Deployment, if staging checks pass too, it goes straight to production with no human click needed."},
 quiz:[
  {q:"What's the key difference between Continuous Delivery and Continuous Deployment?",o:["There is no difference","Delivery needs human approval to release; Deployment releases automatically","Delivery is manual testing only","Deployment never uses testing"],c:1,e:"Continuous Delivery keeps releases ready but waits for approval; Continuous Deployment releases automatically."},
  {q:'What is a "staging environment"?',o:["The final production server","A near-identical copy of production used for final testing","A developer's personal laptop","A type of database"],c:1,e:"Staging mimics production closely so teams can catch issues before a real release."},
  {q:'What is a "rollback"?',o:["Adding new features","Reverting to a previous working version after a problem","Deleting the whole codebase","Merging two branches"],c:1,e:"A rollback undoes a bad release by restoring the last known-good version."},
  {q:'In the suitcase analogy, what does "autopilot leaving the moment it\'s packed" represent?',o:["Continuous Delivery","Continuous Deployment","Manual testing","Version control"],c:1,e:"Continuous Deployment releases automatically as soon as checks pass."},
  {q:"Why is frequent, small releasing generally safer than rare, big releases?",o:["It isn't safer","Smaller changes are easier to test, review, and roll back","It skips testing entirely","It requires no automation"],c:1,e:"Small, frequent releases limit the size and risk of any single change."}
 ]},
{id:'t8',cat:'CI/CD',title:'CI/CD Tools (Jenkins, GitHub Actions)',
 lesson:{what:"CI/CD tools are platforms that actually run your automated pipelines — building, testing, and deploying code whenever triggered. Jenkins is a widely used, self-hosted tool; GitHub Actions is built into GitHub and runs pipelines from simple config files.",
 why:"You need a real tool to execute pipeline steps reliably, on a schedule or trigger, without a human babysitting it. Different tools fit different needs — Jenkins offers deep customization, GitHub Actions offers simplicity if your code lives on GitHub.",
 analogy:"If your pipeline is a recipe, the CI/CD tool is the kitchen and the automatic cooking robot that follows the recipe every time an order comes in.",
 terms:["Workflow/Pipeline file: a config file (often YAML) describing the steps to run","Runner/Agent: the machine that executes the pipeline steps","Job: a group of steps that run together (e.g. a 'test' job)","Trigger: the event that starts a workflow (push, pull request, schedule)","Secrets: securely stored values (like API keys) used during the pipeline"],
 example:'A GitHub Actions file `.github/workflows/test.yml` might say "on push, run `npm install` then `npm test`" — GitHub runs this automatically every time code is pushed.'},
 quiz:[
  {q:"What is Jenkins?",o:["A cloud storage service","A widely used, self-hosted CI/CD automation tool","A programming language","A type of database"],c:1,e:"Jenkins is a popular open-source tool for building CI/CD pipelines."},
  {q:"What is GitHub Actions?",o:["A code editor","A CI/CD tool built directly into GitHub","A firewall service","A version of Linux"],c:1,e:"GitHub Actions lets you define and run pipelines directly within a GitHub repository."},
  {q:"What format are pipeline/workflow files commonly written in?",o:["YAML","JPEG","MP3","PDF"],c:0,e:"Most CI/CD tools, including GitHub Actions, use YAML files to define pipeline steps."},
  {q:'What is a "runner" in CI/CD?',o:["A person who tests manually","The machine that actually executes the pipeline's steps","A type of Git branch","A security certificate"],c:1,e:"Runners (or agents) are the compute resources where pipeline jobs execute."},
  {q:'What are "secrets" used for in a pipeline?',o:["Hiding code from developers","Securely storing sensitive values like passwords or API keys","Compressing files","Formatting code"],c:1,e:"Secrets let pipelines use sensitive credentials without exposing them in plain text."}
 ]},
{id:'t9',cat:'Containers',title:'Docker & Containers',
 lesson:{what:'Docker lets you package an application together with everything it needs (code, libraries, settings) into a single "container" that runs the same way on any machine.',
 why:'"It works on my machine" is a classic problem — an app might run fine on a laptop but break on the server due to different setups. Containers solve this by bundling the whole environment.',
 analogy:"A container is like a shipping container for cargo — no matter what's inside, it has a standard shape that any ship, truck, or crane can handle the same way, everywhere.",
 terms:["Image: a blueprint/template for a container (read-only)","Container: a running instance of an image","Dockerfile: a text file with instructions to build an image","Registry: a place to store and share images (e.g. Docker Hub)","Isolation: containers run separately from each other and the host system"],
 example:"A Dockerfile might say 'start from Python, copy my app code in, install dependencies, run the app' — `docker build` creates an image, and `docker run` starts it as a container."},
 quiz:[
  {q:"What is the main problem Docker solves?",o:["Slow internet speeds","Apps behaving differently across different machines/environments","Poor UI design","Lack of programming languages"],c:1,e:"Containers package the full environment so apps behave the same everywhere."},
  {q:'What is a Docker "image"?',o:["A running container","A blueprint/template used to create containers","A network cable","A type of firewall"],c:1,e:"An image is a read-only template; a container is a running instance of it."},
  {q:"What does a Dockerfile contain?",o:["User passwords","Instructions for how to build a Docker image","A list of employees","Network diagrams"],c:1,e:"A Dockerfile defines the steps needed to assemble an image."},
  {q:"What is a container registry used for?",o:["Running containers directly","Storing and sharing container images","Writing code","Monitoring servers"],c:1,e:"Registries like Docker Hub store images so they can be pulled and reused anywhere."},
  {q:'In the shipping container analogy, what does the "standard shape" represent?',o:["Different setups everywhere","A consistent environment that runs the same on any machine","A security vulnerability","A programming language"],c:1,e:"Just like standard containers work with any ship or truck, Docker containers run consistently everywhere."}
 ]},
{id:'t10',cat:'Containers',title:'Kubernetes Basics',
 lesson:{what:"Kubernetes (K8s) automatically manages many containers across many machines — starting them, restarting them if they crash, and scaling them up or down based on demand.",
 why:"Running one container is easy, but running hundreds across many servers reliably is hard to do by hand. Kubernetes automates that management so applications stay available even when things fail.",
 analogy:"If Docker gives you shipping containers, Kubernetes is the entire port management system — deciding which ship each container goes on, replacing one if it falls into the sea, and adding more ships when traffic increases.",
 terms:["Pod: the smallest deployable unit in Kubernetes, usually one or a few containers","Node: a machine (physical or virtual) that runs pods","Cluster: a group of nodes managed together by Kubernetes","Deployment: a config describing how many copies of a pod should run","Self-healing: Kubernetes automatically restarts or replaces failed containers"],
 example:'You tell Kubernetes "always keep 3 copies of my app running" — if one crashes, Kubernetes automatically starts a new one to replace it.'},
 quiz:[
  {q:"What does Kubernetes primarily manage?",o:["Email servers","Many containers across many machines","Spreadsheets","Graphic design files"],c:1,e:"Kubernetes automates the deployment, scaling, and management of containers."},
  {q:'What is a "pod" in Kubernetes?',o:["A physical server","The smallest deployable unit, usually holding one or a few containers","A type of firewall","A programming language"],c:1,e:"A pod is the basic building block Kubernetes schedules and runs."},
  {q:'What does "self-healing" mean in Kubernetes?',o:["Servers physically repair themselves","Kubernetes automatically restarts or replaces failed containers","Code fixes its own bugs","Networks reroute automatically"],c:1,e:"Kubernetes detects failed containers and replaces them to maintain the desired state."},
  {q:'What is a "node"?',o:["A single line of code","A machine that runs pods within a cluster","A type of database","A Git branch"],c:1,e:"Nodes are the individual machines that make up a Kubernetes cluster."},
  {q:'What does a Kubernetes "Deployment" describe?',o:["How many copies of a pod should run and how to manage them","A single email","A firewall rule","A CSS style"],c:0,e:"A Deployment tells Kubernetes the desired state, like 'keep 3 replicas running.'"}
 ]},
{id:'t11',cat:'Infrastructure',title:'Infrastructure as Code (Terraform)',
 lesson:{what:"Infrastructure as Code (IaC) means defining servers, networks, and other infrastructure using code/config files instead of manually clicking through a cloud dashboard. Terraform is a popular tool for this.",
 why:"Manually setting up servers is slow, error-prone, and hard to repeat exactly. With IaC, infrastructure becomes version-controlled, repeatable, and reviewable — just like application code.",
 analogy:"It's like the difference between building furniture from memory each time versus following a precise instruction sheet that produces the exact same result every time, and that you can hand to someone else.",
 terms:["Terraform: a popular open-source IaC tool","Provider: a plugin that lets Terraform talk to a specific cloud (AWS, Azure, GCP)","State: Terraform's record of what infrastructure currently exists","Plan: a preview of what changes Terraform will make before applying them","Apply: actually creating/updating infrastructure to match the code"],
 example:"A Terraform file might describe 'create one virtual server with 2 CPUs in AWS' — running `terraform apply` creates exactly that server automatically."},
 quiz:[
  {q:'What does "Infrastructure as Code" mean?',o:["Writing infrastructure specs in code/config instead of manual clicks","Coding infrastructure diagrams as images","Manually configuring every server by hand","Writing only frontend code"],c:0,e:"IaC defines infrastructure using code files, making it repeatable and version-controlled."},
  {q:"What is Terraform?",o:["A container runtime","A popular open-source tool for Infrastructure as Code","A programming language for websites","A type of firewall"],c:1,e:"Terraform lets you define and provision infrastructure using configuration files."},
  {q:"What does `terraform plan` do?",o:["Immediately deletes infrastructure","Previews what changes will be made before applying them","Writes application code","Sends an email"],c:1,e:"`terraform plan` shows a preview so you can review changes before they happen."},
  {q:'What is a Terraform "provider"?',o:["A person managing the servers","A plugin that lets Terraform interact with a specific cloud platform","A type of container","A network cable"],c:1,e:"Providers connect Terraform to specific platforms like AWS, Azure, or GCP."},
  {q:"Why is IaC considered safer than manual configuration?",o:["It isn't safer","Because changes are reviewable, repeatable, and tracked like code","Because it skips testing","Because it requires no documentation"],c:1,e:"IaC brings the same rigor (review, history, repeatability) that code already has to infrastructure."}
 ]},
{id:'t12',cat:'Infrastructure',title:'Configuration Management (Ansible)',
 lesson:{what:"Configuration management tools like Ansible automatically set up and configure software on many servers — installing packages, editing settings, and keeping servers consistent — using instruction files instead of manual commands.",
 why:"Once servers exist (often via Terraform), they still need software installed and configured correctly. Doing this by hand across many servers is slow and inconsistent; Ansible automates it reliably.",
 analogy:"If Terraform builds the empty house (the server), Ansible is the team that moves in and sets up all the furniture and utilities exactly the same way in every house, following the same checklist.",
 terms:["Playbook: a file describing the steps/tasks Ansible should perform","Task: a single action, like 'install nginx'","Inventory: the list of servers Ansible will manage","Idempotent: running the same playbook repeatedly gives the same safe result","Agentless: Ansible uses SSH, no special software needed on target servers"],
 example:"An Ansible playbook might say 'install nginx, then start the nginx service' — running it against 50 servers configures all of them identically in one command."},
 quiz:[
  {q:"What does a configuration management tool like Ansible do?",o:["Automatically installs and configures software on servers","Designs website layouts","Compiles code into binaries","Manages email inboxes"],c:0,e:"Ansible automates setting up and configuring software consistently across servers."},
  {q:'What is an Ansible "playbook"?',o:["A single server","A file describing the tasks Ansible should perform","A type of firewall","A cloud provider"],c:1,e:"Playbooks list the steps/tasks that Ansible executes against target servers."},
  {q:'What does "idempotent" mean here?',o:["Running it once breaks the system","Running it repeatedly produces the same safe result without duplicating actions","It only runs once ever","It requires manual approval each time"],c:1,e:"Idempotent operations can be safely re-run without unintended side effects."},
  {q:"How does Ansible typically connect to servers?",o:["Physical cables only","SSH, without requiring special agent software","Bluetooth","Email"],c:1,e:"Ansible is 'agentless' — it uses standard SSH connections."},
  {q:"In the house analogy, what does Ansible represent?",o:["Building the empty house","Setting up furniture and utilities consistently inside","Selling the house","Designing the house's architecture"],c:1,e:"Ansible configures what runs inside servers, like furnishing a house after it's built."}
 ]},
{id:'t13',cat:'Cloud',title:'Cloud Computing Basics',
 lesson:{what:"Cloud computing means renting computing resources (servers, storage, databases) from a provider like AWS, Azure, or Google Cloud over the internet, instead of buying and maintaining your own hardware.",
 why:"Cloud platforms let teams launch and scale infrastructure in minutes instead of weeks, pay only for what they use, and access ready-made services without building them from scratch.",
 analogy:"Owning physical servers is like buying a car — you own it and pay for it whether you use it or not. Cloud computing is like a ride-sharing app — you request exactly what you need, when you need it.",
 terms:["IaaS: Infrastructure as a Service — renting raw servers/storage/networking","PaaS: Platform as a Service — a ready-made platform to run your app without managing servers","SaaS: Software as a Service — using a finished application over the internet, like Gmail","Region/Availability Zone: physical locations where cloud data centers are located","Elasticity: automatically scaling resources up or down based on demand"],
 example:"Instead of buying a physical server, you launch a virtual machine on AWS in minutes, use it, and shut it down when done — paying only for the hours it ran."},
 quiz:[
  {q:"What is cloud computing?",o:["Renting computing resources over the internet instead of owning hardware","A type of weather forecasting","A programming language","A local-only storage method"],c:0,e:"Cloud computing provides on-demand computing resources over the internet."},
  {q:'What does "IaaS" stand for?',o:["Internet as a Software","Infrastructure as a Service","Information as a Standard","Integration as a System"],c:1,e:"IaaS refers to renting basic infrastructure like virtual servers, storage, and networking."},
  {q:'What is "elasticity" in cloud computing?',o:["Fixed, unchangeable resources","Automatically scaling resources up or down based on demand","A type of encryption","A billing error"],c:1,e:"Elasticity allows cloud resources to expand or shrink automatically to match demand."},
  {q:"What is an example of SaaS?",o:["A raw virtual server","A finished application used over the internet, like Gmail","A physical hard drive","A programming language"],c:1,e:"SaaS delivers ready-to-use software over the internet with no setup needed."},
  {q:"What's a key benefit of cloud computing over owning physical servers?",o:["You must always pay a fixed price regardless of usage","You can pay only for what you use and scale quickly","It requires more hardware maintenance","It cannot be automated"],c:1,e:"Cloud computing offers pay-as-you-go pricing and fast, flexible scaling."}
 ]},
{id:'t14',cat:'Operations',title:'Monitoring & Logging',
 lesson:{what:"Monitoring is continuously watching a system's health (like CPU usage, response times, errors) and logging is recording detailed records of events as they happen.",
 why:"In fast-moving, automated DevOps environments, you can't manually watch every server. Monitoring and logging give visibility into what's happening, alert you when something goes wrong, and help you investigate why.",
 analogy:"Monitoring is like a car's dashboard — showing speed, fuel, and warning lights at a glance. Logging is like a black box flight recorder — a detailed history you check after something goes wrong.",
 terms:["Metric: a measurable number over time, like CPU usage or request count","Log: a timestamped record of an event or message","Alert: an automatic notification triggered when something crosses a threshold","Dashboard: a visual display of metrics, often in real time","Uptime: the percentage of time a system is available and working"],
 example:"A monitoring tool tracks CPU usage; if it spikes to 95%, an alert automatically messages the on-call engineer, who then checks the logs to find the cause."},
 quiz:[
  {q:"What is the main purpose of monitoring?",o:["To continuously watch a system's health","To design user interfaces","To write new application features","To manage Git branches"],c:0,e:"Monitoring continuously tracks metrics to reveal a system's current health."},
  {q:'What is a "log"?',o:["A visual dashboard chart","A timestamped record of an event or message","A type of firewall rule","A cloud billing report"],c:1,e:"Logs record detailed, timestamped information about what happened."},
  {q:'What triggers an "alert"?',o:["A scheduled meeting","A metric crossing a defined threshold","A new Git commit","A user login only"],c:1,e:"Alerts automatically notify engineers when a monitored metric behaves abnormally."},
  {q:"In the dashboard/black-box analogy, what does logging represent?",o:["A quick glance at current status","A detailed record checked after something goes wrong","A type of firewall","A cloud provider"],c:1,e:"Like a flight recorder, logs provide the detailed history needed to investigate incidents."},
  {q:'What does "uptime" measure?',o:["How fast code compiles","The percentage of time a system is available and working","The number of Git commits","The size of a database"],c:1,e:"Uptime reflects system reliability and availability over time."}
 ]},
{id:'t15',cat:'Operations',title:'Security in DevOps (DevSecOps)',
 lesson:{what:"DevSecOps means building security checks into every stage of the DevOps pipeline — from writing code to deploying it — instead of treating security as a separate, final step.",
 why:"Adding security only at the end is slow and risky; vulnerabilities found late are expensive to fix and may already be in production. DevSecOps catches issues early, automatically, alongside regular testing.",
 analogy:"It's like building safety inspections into every stage of constructing a building — checking the foundation and wiring as you go — instead of only inspecting the finished building.",
 terms:["Vulnerability: a weakness that could be exploited by an attacker","Static analysis (SAST): scanning code for security issues without running it","Secrets management: securely storing sensitive values like passwords and API keys","Least privilege: giving users/systems only the access they truly need, nothing more","Patch: an update that fixes a known vulnerability"],
 example:"A CI/CD pipeline automatically scans new code for known vulnerabilities every time it's pushed, blocking the release if a serious issue is found — before it reaches production."},
 quiz:[
  {q:"What does DevSecOps add to the DevOps process?",o:["Security checks built into every stage of the pipeline","More manual paperwork","Slower deployments only","Marketing automation"],c:0,e:"DevSecOps integrates security throughout the pipeline rather than as a final, separate step."},
  {q:"Why is finding security issues early better than finding them later?",o:["It isn't better","Early issues are cheaper and easier to fix, before reaching production","Early issues are always ignored","It has no impact on cost"],c:1,e:"Fixing vulnerabilities before release avoids the higher cost and risk of production fixes."},
  {q:'What is "least privilege"?',o:["Giving everyone full access for convenience","Giving users/systems only the access they truly need","Removing all access from everyone","A type of encryption algorithm"],c:1,e:"Least privilege limits potential damage by restricting access to only what's necessary."},
  {q:"What does static analysis (SAST) do?",o:["Runs the application to test performance","Scans code for security issues without running it","Deploys code to production","Manages Git branches"],c:1,e:"SAST tools analyze source code for known vulnerability patterns without executing it."},
  {q:'What is a "vulnerability"?',o:["A fully patched, secure system","A weakness that could be exploited by an attacker","A type of automated test","A cloud region"],c:1,e:"A vulnerability is a flaw or weakness that attackers could potentially exploit."}
 ]}
];

const STORAGE_KEY = 'devops-tutor-progress-v1';
let state = { currentIndex:0, selectedIndex:0, completed:{}, streak:0, lastActiveDate:null, xp:0 };

function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){ /* defaults stand */ }
  render();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error('save failed', e); }
}

function statusOf(index){
  const topic = CURRICULUM[index];
  if(state.completed[topic.id]) return 'done';
  if(index <= state.currentIndex) return 'current';
  return 'locked';
}

function renderPipeline(){
  const el = document.getElementById('pipeline');
  el.innerHTML = '';
  CURRICULUM.forEach((topic, i) => {
    const status = statusOf(i);
    if(i > 0){
      const stageWrap = document.createElement('div');
      stageWrap.className = 'stage' + (statusOf(i-1)==='done' ? ' done' : '');
      const conn = document.createElement('div');
      conn.className = 'connector';
      stageWrap.appendChild(conn);
      el.appendChild(stageWrap);
    }
    const node = document.createElement('div');
    node.className = 'node ' + status + (i===state.selectedIndex ? ' selected' : '');
    const num = String(i+1).padStart(2,'0');
    const statusLine = status==='done' ? '✓ passed' : status==='current' ? '● ready' : '🔒 locked';
    node.innerHTML = `<div class="circle">${status==='done' ? '✓' : num}</div><div class="label">${topic.title}</div><div class="status-line">${statusLine}</div>`;
    if(status !== 'locked') node.addEventListener('click', () => selectTopic(i));
    el.appendChild(node);
  });
}

function selectTopic(i){
  state.selectedIndex = i;
  document.getElementById('quizCard').style.display = 'none';
  render();
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function boldTerm(s){
  const idx = s.indexOf(':');
  if(idx === -1) return esc(s);
  return `<strong>${esc(s.slice(0,idx))}</strong>:${esc(s.slice(idx+1))}`;
}

function renderLesson(topic){
  const L = topic.lesson;
  const html = `
    <h3>What it is</h3><p>${esc(L.what)}</p>
    <h3>Why it matters in DevOps</h3><p>${esc(L.why)}</p>
    <h3>Real-world analogy</h3><p>${esc(L.analogy)}</p>
    <h3>Key terms</h3><ul>${L.terms.map(t=>`<li>${boldTerm(t)}</li>`).join('')}</ul>
    <h3>Example</h3><p>${esc(L.example)}</p>
  `;
  document.getElementById('lessonContent').innerHTML = html;
  document.getElementById('lessonBtnRow').innerHTML = `<button class="btn primary" id="quizBtn">📝 Take quiz</button>`;
  document.getElementById('quizBtn').addEventListener('click', () => generateQuiz(topic));
}

function render(){
  document.getElementById('streakVal').textContent = state.streak;
  document.getElementById('xpVal').textContent = state.xp;
  renderPipeline();
  const topic = CURRICULUM[state.selectedIndex];
  document.getElementById('topicEyebrow').textContent = topic.cat + ' · stage ' + String(state.selectedIndex+1).padStart(2,'0') + '/' + CURRICULUM.length;
  document.getElementById('topicTitle').textContent = topic.title;
  renderLesson(topic);
  document.getElementById('quizCard').style.display = 'none';
}

function generateQuiz(topic){
  const quizCard = document.getElementById('quizCard');
  const quizContent = document.getElementById('quizContent');
  quizCard.style.display = 'block';
  quizCard.scrollIntoView({behavior:'smooth', block:'nearest'});
  let html = '';
  topic.quiz.forEach((q, qi) => {
    html += `<div class="quiz-q" data-qi="${qi}"><div class="qtext"><span class="qnum">Q${qi+1}.</span>${esc(q.q)}</div><div class="options">`;
    q.o.forEach((opt, oi) => {
      html += `<label class="option" data-oi="${oi}"><input type="radio" name="q${qi}" value="${oi}"> ${esc(opt)}</label>`;
    });
    html += `</div><div class="explain" style="display:none;"></div></div>`;
  });
  html += `<div class="btn-row"><button class="btn primary" id="submitQuizBtn">Submit answers</button></div>`;
  quizContent.innerHTML = html;
  document.getElementById('submitQuizBtn').addEventListener('click', () => submitQuiz(topic));
}

function submitQuiz(topic){
  const questions = document.querySelectorAll('.quiz-q');
  let score = 0;
  questions.forEach((qEl, qi) => {
    const selected = qEl.querySelector('input:checked');
    const correctIdx = topic.quiz[qi].c;
    qEl.querySelectorAll('.option').forEach((optEl, oi) => {
      optEl.style.pointerEvents = 'none';
      if(oi === correctIdx) optEl.classList.add('correct');
      else if(selected && parseInt(selected.value) === oi) optEl.classList.add('incorrect');
    });
    if(selected && parseInt(selected.value) === correctIdx) score++;
    const explainEl = qEl.querySelector('.explain');
    explainEl.textContent = topic.quiz[qi].e;
    explainEl.style.display = 'block';
  });
  const submitBtn = document.getElementById('submitQuizBtn');
  if(submitBtn) submitBtn.remove();
  const banner = document.createElement('div');
  banner.className = 'score-banner';
  banner.textContent = `✓ pipeline complete — scored ${score}/${topic.quiz.length}`;
  document.getElementById('quizContent').prepend(banner);

  const firstTime = !state.completed[topic.id];
  state.completed[topic.id] = { score, total: topic.quiz.length };
  state.xp += score * 10 + (firstTime ? 20 : 0);

  const today = todayStr();
  if(state.lastActiveDate !== today){
    if(state.lastActiveDate && daysBetween(state.lastActiveDate, today) === 1) state.streak += 1;
    else state.streak = 1;
    state.lastActiveDate = today;
  }
  if(state.selectedIndex === state.currentIndex && state.currentIndex < CURRICULUM.length - 1){
    state.currentIndex += 1;
  }
  saveState();
  document.getElementById('streakVal').textContent = state.streak;
  document.getElementById('xpVal').textContent = state.xp;
  renderPipeline();
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if(!confirm('Reset all progress, XP, and streak? This cannot be undone.')) return;
  state = { currentIndex:0, selectedIndex:0, completed:{}, streak:0, lastActiveDate:null, xp:0 };
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('quizCard').style.display = 'none';
  render();
});

loadState();
</script>
</body>
</html>
